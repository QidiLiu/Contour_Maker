[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "contour-maker"
version = "3.0.0"
description = "Three instance-segmentation schemes (YOLO-Seg, Det-UNet, RF-DETR-Seg) with PyTorch training and C++/MNN deployment"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Contour_Maker contributors" }]
keywords = [
    "instance-segmentation",
    "ultrasound",
    "YOLO",
    "RF-DETR",
    "MNN",
    "edge-deployment",
    "ADE20K",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core training/validation dependencies.
# Tested with Python 3.11 + torch 2.14.1+cu130 + ultralytics 8.4.174 (RTX 4060 Ti).
# PyPI's default index provides CUDA builds; no extra index is configured.
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.4.0",
    "numpy>=1.26,<2.2",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "albumentations>=1.4",
    "tabulate>=0.9",
    "requests>=2.31",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxslim>=0.1",
    "onnxscript>=0.1",     # dynamo ONNX exporter required by torch>=2.14
    "pyarrow>=15",         # ADE20K parquet reader
    "safetensors>=0.4",    # HF RF-DETR weight conversion
]

[project.optional-dependencies]
# RF-DETR-Seg-Nano training/export. Kept optional because it pulls in a
# Lightning + transformers training stack.
rfdetr = [
    "rfdetr[train,onnx]>=1.11,<2",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/<your-name>/Contour_Maker"
Issues = "https://github.com/<your-name>/Contour_Maker/issues"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "build", "data", "runs", "reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]
