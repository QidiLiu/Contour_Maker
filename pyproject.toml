[project]
name = "contour-maker"
version = "2.0.0"
description = "Ultrasound lesion contour segmentation: YOLO26n+MK-UNet (two-stage) vs YOLO26n-seg (one-stage)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# 训练/验证依赖。torch/torchvision 走 cu128 index, 由 uv 的 tool.uv 配置提供。
dependencies = [
    "torch>=2.6,<2.12",
    "torchvision>=0.21,<0.27",
    "ultralytics>=8.4.0",
    "numpy>=1.26,<2.2",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "albumentations>=1.4",
    "tabulate>=0.9",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxslim>=0.1",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# torch/torchvision 的 CUDA 构建不在 PyPI 默认索引, 单独指定。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]