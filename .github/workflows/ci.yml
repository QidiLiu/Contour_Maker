name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy "opencv-python-headless>=4.9" scipy pandas pyyaml tabulate
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check common yolo-seg-train det-unet-train rfdetr-seg-train scripts tests
          ruff format --check common yolo-seg-train det-unet-train rfdetr-seg-train scripts tests
      - name: Tests
        run: pytest -q
